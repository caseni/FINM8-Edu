name: Visual QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  academy-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build web export
        run: npm run build:web

      - name: Install ephemeral Playwright core
        run: |
          npm install --no-save --package-lock=false playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No system Chrome/Chromium found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Using system browser: $CHROME_BIN"

      - name: Serve web export
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/finm8-visual-qa-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/finm8-visual-qa-server.log
          exit 1

      - name: Capture representative Academy visual flows
        run: |
          mkdir -p visual-qa
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';

          const baseUrl = 'http://127.0.0.1:4173/';
          const allTracks = [
            'Temel Ekonomi',
            'Finansal Piyasalar',
            'Teknik Analiz',
            'Temel Analiz',
            'Risk ve Portföy',
            'Piyasa Psikolojisi',
            'Stratejiler',
            'Algoritmik Trade ve Quant',
            'SMC / ICT · İleri',
            'Varlık Okulları',
          ];
          const representativeTracks = [
            'Temel Ekonomi',
            'Teknik Analiz',
            'Algoritmik Trade ve Quant',
            'SMC / ICT · İleri',
            'Varlık Okulları',
          ];
          const slug = (value) => value
            .toLocaleLowerCase('tr-TR')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/ı/g, 'i')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-|-$/g, '');

          const diagnostics = [];
          function attachDiagnostics(page, label) {
            page.on('console', (message) => {
              const text = `[${label} console:${message.type()}] ${message.text()}`;
              console.log(text);
              if (message.type() === 'error') diagnostics.push(text);
            });
            page.on('pageerror', (error) => {
              const text = `[${label} pageerror] ${error.stack || error.message}`;
              console.log(text);
              diagnostics.push(text);
            });
            page.on('requestfailed', (request) => {
              const text = `[${label} requestfailed] ${request.method()} ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`;
              console.log(text);
              diagnostics.push(text);
            });
            page.on('response', (response) => {
              if (response.status() >= 500) {
                const text = `[${label} response:${response.status()}] ${response.url()}`;
                console.log(text);
                diagnostics.push(text);
              }
            });
          }

          async function assertNoHorizontalOverflow(page, label) {
            const overflow = await page.evaluate(() => ({
              viewport: document.documentElement.clientWidth,
              page: document.documentElement.scrollWidth,
            }));
            console.log(`${label}: viewport=${overflow.viewport}px page=${overflow.page}px`);
            if (overflow.page > overflow.viewport + 1) {
              throw new Error(`${label} has horizontal overflow: ${overflow.page}px > ${overflow.viewport}px`);
            }
          }

          async function openAcademy(page, debugName) {
            await page.goto(baseUrl, { waitUntil: 'networkidle' });
            await page.waitForTimeout(1200);
            const academyTab = page.getByText('Academy', { exact: true }).first();
            try {
              await academyTab.waitFor({ state: 'visible', timeout: 8000 });
            } catch (error) {
              console.log(`${debugName} landing body:\n${await page.locator('body').innerText()}`);
              await page.screenshot({ path: `visual-qa/${debugName}-landing-debug.png`, fullPage: true });
              throw error;
            }
            await academyTab.click();
            await page.getByText('Finansı konu konu derinleştir.').waitFor();
          }

          async function buttonNames(page) {
            return page.getByRole('button').evaluateAll((buttons) =>
              buttons
                .map((button) => button.getAttribute('aria-label') || button.textContent || '')
                .map((value) => value.trim())
                .filter(Boolean)
            );
          }

          async function openTrackAndFindFirstLesson(page, trackTitle) {
            const before = new Set(await buttonNames(page));
            await page.getByRole('button', { name: new RegExp(`^${trackTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} derslerini aç$`, 'i') }).click();
            await page.waitForTimeout(150);
            const after = await buttonNames(page);
            const firstLessonName = after.find((name) => !before.has(name) && !/derslerini kapat$/i.test(name));
            if (!firstLessonName) {
              throw new Error(`No lesson button became visible for ${trackTitle}`);
            }
            return firstLessonName;
          }

          async function captureLessonFlow(page, trackTitle) {
            const trackSlug = slug(trackTitle);
            await openAcademy(page, `mobile-${trackSlug}`);
            const firstLessonName = await openTrackAndFindFirstLesson(page, trackTitle);
            await assertNoHorizontalOverflow(page, `${trackSlug}-mobile-expanded`);
            await page.screenshot({ path: `visual-qa/${trackSlug}-mobile-expanded.png`, fullPage: true });

            await page.getByRole('button', { name: firstLessonName, exact: true }).click();
            await page.getByText(/Adım 1\//).waitFor();
            const stepMatch = (await page.getByText(/Adım 1\//).innerText()).match(/\/(\d+)/);
            const totalSteps = Number(stepMatch?.[1] ?? 1);
            if (!Number.isFinite(totalSteps) || totalSteps < 1) {
              throw new Error(`Invalid lesson step count for ${trackTitle}: ${stepMatch?.[1]}`);
            }
            console.log(`${trackTitle}: lesson=${firstLessonName} steps=${totalSteps}`);

            for (let step = 1; step <= totalSteps; step += 1) {
              await assertNoHorizontalOverflow(page, `${trackSlug}-mobile-step-${step}`);
              await page.screenshot({
                path: `visual-qa/${trackSlug}-mobile-step-${String(step).padStart(2, '0')}.png`,
                fullPage: true,
              });
              if (step < totalSteps) {
                await page.getByRole('button', { name: /Sonraki adıma geç/i }).click();
                await page.getByText(new RegExp(`Adım ${step + 1}\\/${totalSteps}`)).waitFor();
              }
            }
          }

          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true });
          try {
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
            attachDiagnostics(mobile, 'mobile');
            await openAcademy(mobile, 'mobile-all-tracks');
            await assertNoHorizontalOverflow(mobile, 'academy-mobile-collapsed');
            await mobile.screenshot({ path: 'visual-qa/academy-mobile-collapsed.png', fullPage: true });

            for (const trackTitle of allTracks) {
              const trackSlug = slug(trackTitle);
              await mobile.getByRole('button', { name: new RegExp(`^${trackTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} derslerini aç$`, 'i') }).click();
              await mobile.waitForTimeout(100);
              await assertNoHorizontalOverflow(mobile, `academy-mobile-${trackSlug}-expanded`);
              await mobile.screenshot({ path: `visual-qa/academy-mobile-${trackSlug}-expanded.png`, fullPage: true });
              await mobile.getByRole('button', { name: new RegExp(`^${trackTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} derslerini kapat$`, 'i') }).click();
            }

            for (const trackTitle of representativeTracks) {
              await captureLessonFlow(mobile, trackTitle);
            }

            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            attachDiagnostics(desktop, 'desktop');
            await openAcademy(desktop, 'desktop');
            await assertNoHorizontalOverflow(desktop, 'academy-desktop-collapsed');
            await desktop.screenshot({ path: 'visual-qa/academy-desktop-collapsed.png', fullPage: true });

            for (const trackTitle of representativeTracks) {
              const trackSlug = slug(trackTitle);
              await desktop.getByRole('button', { name: new RegExp(`^${trackTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} derslerini aç$`, 'i') }).click();
              await assertNoHorizontalOverflow(desktop, `academy-desktop-${trackSlug}-expanded`);
              await desktop.screenshot({ path: `visual-qa/academy-desktop-${trackSlug}-expanded.png`, fullPage: true });
              await desktop.getByRole('button', { name: new RegExp(`^${trackTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} derslerini kapat$`, 'i') }).click();
            }

            if (diagnostics.length > 0) {
              throw new Error(`Visual QA runtime diagnostics failed:\n${diagnostics.join('\n')}`);
            }
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finm8-edu-visual-qa
          path: visual-qa/*.png
          if-no-files-found: warn
