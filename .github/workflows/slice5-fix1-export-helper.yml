name: Slice5 FIX-1 Native Export Helper

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  export-native-assets:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/edu-beginner-markets-editorial-images-slice5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/edu-beginner-markets-editorial-images-slice5
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0

      - name: Re-export native 1200x800 WebPs
        run: python scripts/_slice5_fix1_export_1200.py

      - name: Verify exact binary scope and intrinsic dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('assets/learning/beginner/markets')
          names = [
            'asset-classes-hook.webp','asset-classes-concept.webp','asset-classes-misconception.webp','asset-classes-summary.webp',
            'liquidity-hook.webp','liquidity-concept.webp','liquidity-practice.webp','liquidity-misconception.webp','liquidity-summary.webp',
            'bid-ask-hook.webp','bid-ask-concept.webp','bid-ask-practice.webp','bid-ask-misconception.webp','bid-ask-summary.webp',
            'order-types-hook.webp','order-types-concept.webp','order-types-practice.webp','order-types-misconception.webp','order-types-summary.webp',
            'slippage-hook.webp','slippage-concept.webp','slippage-practice.webp','slippage-misconception.webp','slippage-summary.webp',
          ]
          assert len(names) == 24 and len(set(names)) == 24
          for name in names:
              p = root / name
              assert p.is_file(), name
              with Image.open(p) as im:
                  assert im.format == 'WEBP', (name, im.format)
                  assert im.size == (1200, 800), (name, im.size)
              print(f'PASS {name} 1200x800')
          PY

      - name: Commit only native binary replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/learning/beginner/markets/*.webp
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
            exit 1
          fi
          CHANGED="$(git diff --cached --name-only)"
          echo "$CHANGED"
          COUNT="$(printf '%s\n' "$CHANGED" | grep -c '^assets/learning/beginner/markets/.*\.webp$')"
          TOTAL="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l)"
          test "$COUNT" -eq 24
          test "$TOTAL" -eq 24
          git commit -m "fix: re-export Beginner Markets assets at 1200x800"
          git push origin HEAD:agent/edu-beginner-markets-editorial-images-slice5
