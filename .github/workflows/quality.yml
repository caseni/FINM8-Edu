name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency audit (read-only)
        run: npm audit --omit=dev --json > runtime-audit.json || true

      - name: Full dependency audit (read-only)
        run: npm audit --json > full-audit.json || true

      - name: Dependency audit summary
        run: node scripts/dependencyAuditSummary.cjs runtime-audit.json full-audit.json

      - name: Critical advisory parent chains (read-only)
        run: npm ls shell-quote tar --all || true

      - name: Safe audit-fix plan (dry-run only)
        run: npm audit fix --omit=dev --dry-run || true

      - name: Apply safe audit-fix candidate in runner only
        run: npm audit fix --omit=dev || true

      - name: Post-fix runtime dependency audit
        run: npm audit --omit=dev --json > runtime-audit-after-fix.json || true

      - name: Post-fix full dependency audit
        run: npm audit --json > full-audit-after-fix.json || true

      - name: Post-fix dependency audit summary
        run: node scripts/dependencyAuditSummary.cjs runtime-audit-after-fix.json full-audit-after-fix.json

      - name: Candidate dependency diff
        run: git diff -- package.json package-lock.json

      - name: Upload safe dependency-fix candidate
        uses: actions/upload-artifact@v4
        with:
          name: safe-dependency-fix-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error

      - name: Typecheck
        run: npm run typecheck

      - name: Content quality audit
        run: npm run quality:content

      - name: Build web bundle
        run: npm run build:web
