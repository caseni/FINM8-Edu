name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency audit snapshot (read-only)
        run: npm audit --omit=dev --json > runtime-audit.json || true

      - name: Full dependency audit snapshot (read-only)
        run: npm audit --json > full-audit.json || true

      - name: Dependency audit summary
        run: node scripts/dependencyAuditSummary.cjs runtime-audit.json full-audit.json

      - name: Runtime critical vulnerability gate
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Content quality audit
        run: npm run quality:content

      - name: Academy visual routing audit
        run: node scripts/academyVisualRoutingAudit.mjs

      - name: Real editorial image asset audit
        run: node scripts/editorialImageCoverage.mjs

      - name: Academy editorial batch audit
        run: node scripts/academyEditorialBatchAudit.mjs

      - name: Academy expansion editorial audit
        run: node scripts/academyExpansionEditorialBatchAudit.mjs

      - name: Build web bundle
        run: npm run build:web
